[workspace]
members = [
    "crates/canscope-core",
    "crates/canscope-parser",
    "crates/canscope-dbc",
    "crates/canscope-playback",
    "crates/canscope-export",
    "crates/canscope-adapter",
    "crates/canscope-app",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
thiserror = "2"